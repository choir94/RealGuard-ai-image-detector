<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RealGuard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 280px; font: 13px/1.5 -apple-system, system-ui, sans-serif; background: #111318; color: #e5e9f0; }
.header { padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; }
.header .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #2563eb, #7c3aed); display: flex; align-items: center; justify-content: center; font: 700 12px sans-serif; color: #fff; }
.header b { font-size: 14px; }
.body { padding: 0 14px 12px; }
.row { display: flex; justify-content: space-between; padding: 4px 0; }
.row span:first-child { color: #8b93a3; }
.row span:last-child { font-weight: 600; }
progress { width: 100%; height: 4px; border: 0; border-radius: 2px; background: #2a2f3a; }
progress::-webkit-progress-bar { background: #2a2f3a; border-radius: 2px; }
progress::-webkit-progress-value { background: #2563eb; border-radius: 2px; }
#stats { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat { padding: 6px 8px; border-radius: 8px; text-align: center; }
.stat .n { font: 700 18px system-ui; }
.stat .l { font-size: 10px; color: #8b93a3; text-transform: uppercase; }
.stat.ai { background: rgba(244,63,94,.12); }
.stat.ai .n { color: #f43f5e; }
.stat.real { background: rgba(52,211,153,.12); }
.stat.real .n { color: #34d399; }
.stat.unsure { background: rgba(252,211,77,.12); }
.stat.unsure .n { color: #fcd34d; }
.stat.pending { background: rgba(125,211,252,.12); }
.stat.pending .n { color: #7dd3fc; }
.actions { display: flex; gap: 6px; margin-top: 10px; }
button { flex: 1; padding: 8px; border: 0; border-radius: 8px; font: 600 12px system-ui; cursor: pointer; background: #2563eb; color: #fff; }
button:hover { background: #1d4ed8; }
button.secondary { background: #2a2f3a; color: #e5e9f0; }
button.secondary:hover { background: #363c49; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 8px; border-radius: 8px; background: rgba(255,255,255,.04); }
.toggle-row label { font-size: 12px; color: #8b93a3; }
.switch { position: relative; width: 36px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background: #2a2f3a; border-radius: 999px; transition: .3s; }
.slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #e5e9f0; border-radius: 50%; transition: .3s; }
input:checked + .slider { background: #2563eb; }
input:checked + .slider:before { transform: translateX(16px); }
</style>
</head>
<body>
<div class="header"><div class="logo">RG</div><b>RealGuard</b></div>
<div class="body">
  <div class="row"><span>Status</span><span id="status">boot</span></div>
  <div class="row"><span>Engine</span><span id="engine">—</span></div>
  <div class="row"><span>Model</span><span id="model" style="font-size:10px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span></div>
  <progress id="progress" style="display:none" value="0" max="1"></progress>
  <div id="stats" style="display:none">
    <div class="stat-grid">
      <div class="stat ai"><div class="n" id="ai-count">0</div><div class="l">AI</div></div>
      <div class="stat real"><div class="n" id="real-count">0</div><div class="l">Real</div></div>
      <div class="stat unsure"><div class="n" id="unsure-count">0</div><div class="l">Unsure</div></div>
      <div class="stat pending"><div class="n" id="pending-count">0</div><div class="l">Pending</div></div>
    </div>
    <div class="row" style="margin-top:6px"><span>Total scanned</span><span id="total-count">0</span></div>
  </div>
  <div class="actions">
    <button id="rescan" class="secondary">Rescan page</button>
    <button id="lab" class="secondary">Forensics Lab</button>
  </div>
  <div class="toggle-row">
    <label>Auto-blur AI images</label>
    <div class="switch"><input type="checkbox" id="blur-toggle" checked><span class="slider"></span></div>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
