name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: realguard-extension
          path: extension/dist/
          retention-days: 30

  e2e-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node e2e/extension-test.mjs
        env:
          CHROME_PATH: ${{ null }}  # auto-detect Playwright's Chromium
        continue-on-error: true     # E2E requires network for test images
